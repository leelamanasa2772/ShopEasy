<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEasy</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                ShopEasy
            </div>

            

        </nav>
    </header>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-box">

            <h2>Welcome Back 👋</h2>

            <p>Login to your ShopEasy account</p>


            <form id="login-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="auth-link">
                Don't have an account?
                <a href="register.html">
                    Register here
                </a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>© 2026 ShopEasy. All rights reserved.</p>

    </footer>


    <script src="../js/login.js"></script>

</body>

</html>
