<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - E-Commerce Store</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                ShopEasy
            </div>


            <ul class="nav-links">
                

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="product.html">
                        Products
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart 🛒
                        <span id="cart-count">0</span>
                    </a>
                </li>

                <li>
                    <a href="orders.html">
                        Orders
                    </a>
                </li>

                <!-- Logged-in User -->

                <li>
                    <span id="user-name">
                        Welcome
                    </span>
                </li>

                <!-- Logout -->

                <li>
                    <a href="#" id="logout-btn">
                        Logout
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Hero Section -->

    <section class="hero">

        <h2>
            Welcome to ShopEasy
        </h2>

        <p>
            Find the best products at affordable prices.
        </p>

        <button onclick="scrollToProducts()">
            Shop Now
        </button>

    </section>


    <!-- Products Section -->

    <section class="products-section">

        <h2>
            Our Products
        </h2>

        <div
            id="product-container"
            class="product-container">

            <!-- Products will be added using JavaScript -->

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEasy. All rights reserved.
        </p>

    </footer>


    <script src="../js/home.js"></script>

</body>

</html>
