<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - ShopEasy</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            </div>

            <ul class="nav-links">

    </li>

    <li>

        </a>
    </li>

    <li>
        <a href="cart.html">

        </a>
    </li>

    <li>
        <a href="orders.html">
            Orders
        </a>
    </li>

    <!-- Logged-in User -->

    <li>
