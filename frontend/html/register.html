<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ShopEasy</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                ShopEasy
            </div>

           

        </nav>
    </header>


    <!-- Register Section -->
    <section class="auth-section">

        <div class="auth-box">

            <h2>Create Account 🛍️</h2>

            <p>Join ShopEasy today</p>


            <form id="register-form">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>© 2026 ShopEasy. All rights reserved.</p>

    </footer>


    <script src="../js/register.js"></script>

</body>

</html>
